<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glow & Beauty Spa</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    background:linear-gradient(135deg,#ffd6e8,#ffeef5);

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

}

.container{

    width:450px;

    background:white;

    border-radius:25px;

    padding:40px;

    box-shadow:0 15px 40px rgba(255,105,180,.25);

}

.logo{

    font-size:42px;

    text-align:center;

}

h2{

    text-align:center;

    color:#ff4f8b;

    margin-top:10px;

}

.sub{

    text-align:center;

    color:#888;

    margin-bottom:30px;

}

label{

    display:block;

    margin-bottom:6px;

    font-weight:600;

    color:#555;

}

input,
select{

    width:100%;

    padding:13px;

    border:2px solid #ffd0df;

    border-radius:12px;

    outline:none;

    margin-bottom:18px;

    font-size:15px;

    transition:.3s;

}

input:focus,
select:focus{

    border-color:#ff4f8b;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#ff4f8b;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

    font-weight:bold;

}

button:hover{

    background:#e93d78;

}

.footer{

    margin-top:20px;

    text-align:center;

    color:#888;

    font-size:13px;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">🌸</div>

<h2>Glow & Beauty Spa</h2>

<p class="sub">
Đặt lịch chăm sóc da trực tuyến
</p>

<form action="/submit" method="POST">

<label>👤 Họ và tên</label>

<input
type="text"
name="name"
placeholder="Nhập họ tên của bạn"
required>

<label>🎂 Độ tuổi</label>

<input
type="number"
name="age"
min="10"
max="100"
placeholder="Ví dụ: 22"
required>

<label>⚤ Giới tính</label>
<select name="gender" required>
    <option value="Nam">Nam</option>
    <option value="Nữ">Nữ</option>
    <option value="Khác">Khác</option>
</select>

<label>📱 Số điện thoại</label>

<input
type="tel"
name="phone"
placeholder="09xxxxxxxx"
required>

<label>💆 Dịch vụ quan tâm</label>

<select name="service">

<option>Chăm sóc da</option>

<option>Điều trị mụn</option>

<option>Trẻ hóa da</option>

<option>Cấp ẩm phục hồi</option>

<option>Massage thư giãn</option>

</select>

<label>📅 Ngày muốn đến</label>

<input
type="date"
name="date"
required>

<button type="submit">

💖 ĐẶT LỊCH NGAY

</button>

</form>

<div class="footer">

Glow & Beauty Spa © 2026

</div>

</div>

</body>
</html>
